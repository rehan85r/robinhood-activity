<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robinhood Chain Activity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <nav class="navbar">
        <div class="logo">
            <img src="robinhood-logo.png" alt="Robinhood Logo">
            <span>Robinhood Chain Activity</span>
        </div>

        <div class="chain-name">Robinhood Chain</div>
    </nav>

    <main class="hero">

        <div class="badge">
            <span class="dot"></span>
            On-chain activity tracker
        </div>

        <h1>
            Check Your Robinhood<br>
            <span>On-Chain Activity.</span>
        </h1>

        <p>
            Explore your transactions, streaks, milestones,
            and journey across Robinhood Chain.
        </p>

        <div class="wallet-box">

            <input 
                type="text" 
                id="walletInput"
                placeholder="Paste your EVM wallet address"
            >

            <button onclick="checkActivity()">
                Check Activity →
            </button>

        </div>

        <div id="error" class="error"></div>

        <small>
            Your wallet address is used only to fetch public blockchain data.
        </small>

    </main>

    <footer>
        Built for the Robinhood Chain community
    </footer>

    <script src="script.js"></script>

</body>
</html>
