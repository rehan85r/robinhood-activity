<body>
<header class="navbar"><div class="brand"><img src="robinhood-logo.png" alt="Robinhood Logo"><span>Robinhood Chain Activity</span></div></header>
<main class="container"><section class="hero"><h1><span class="line-one">Check Your <span class="lime">Robinhood</span></span><br><span>On-Chain Activity</span></h1><form id="form"><input id="address" placeholder="Paste Wallet Address 0x..." autocomplete="off" required><button>Check Wallet <span>→</span></button></form><section id="tierDetails" class="tier-details"><h2 class="tier-title">Activity Level</h2><div class="tier-grid"><div class="tier-box explorer"><div class="tier-number">50</div><strong>Robin Rookie</strong><span class="tier-range">50+</span><small>Transaction</small></div><div class="tier-box builder"><div class="tier-number">100</div><strong>Robin Runner</strong><span class="tier-range">100+</span><small>Transaction</small></div><div class="tier-box visionary"><div class="tier-number">200</div><strong>Robin Veteran</strong><span class="tier-range">200+</span><small>Transaction</small></div><div class="tier-box pioneer"><div class="tier-number">300</div><strong>Robin Elite</strong><span class="tier-range">300+</span><small>Transaction</small></div></div></section></section><section id="result" class="result"></section><footer class="site-footer"><span class="built">Built By</span><img class="footer-dp" src="rehan-dp.png" alt="Rehan profile photo"><a href="https://x.com/Rehanx85R" target="_blank" rel="noopener">@Rehanx85R</a><a class="follow" href="https://x.com/Rehanx85R" target="_blank" rel="noopener">Follow</a></footer></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const form=document.getElementById("form"),input=document.getElementById("address"),result=document.getElementById("result");
form.addEventListener("submit",async e=>{
e.preventDefault();
const w=input.value.trim();
const tierDetails=document.getElementById("tierDetails");
tierDetails.style.display="none";
result.className="result show";
result.innerHTML='<p style="text-align:center;color:#666;padding:30px 0">Loading wallet activity...</p>';
if(!/^0x[a-fA-F0-9]{40}$/.test(w)){
  tierDetails.style.display="block";
  result.innerHTML='<p style="text-align:center;color:#d9534f;padding:30px 0">Please enter a valid EVM wallet address.</p>';
  return;
}
try{
  const response=await fetch(`/api/wallet?address=${encodeURIComponent(w)}`);
  const data=await response.json();
  if(!response.ok) throw new Error(data.error||"Unable to fetch wallet activity");

  const totalTx=Number(data.totalTransactions||0);
  const firstTransaction=data.firstTransaction||"N/A";
  const lastTransaction=data.lastTransaction||"N/A";
  const activeDays=Number(data.activeDays||0);
  const walletAge=Number(data.walletAge||0);
  const contractInteractions=Number(data.contractInteractions||0);
  const nftInteractions=Number(data.nftInteractions||0);
  const totalVolume=data.totalVolume||"0.00";
  const todayStreak=Number(data.todayStreak||0);
  const longestStreak=Number(data.longestStreak||0);
  const tier=data.tier||"Robin Rookie";
  const activeMonths=Math.max(0,Math.round(walletAge));
  const deployContracts=Number(data.deployContracts||0);

  result.className="result show";
  result.innerHTML=`
<div class="wrap" style="margin-bottom:0!important;padding-bottom:0!important;"><div class="card" id="card" style="margin-bottom:0!important;"><div class="top"><div class="cardbrand"><div class="logobox"><img src="robinhood-logo.png" alt="Robinhood Logo"></div><div><h3>Robinhood Chain</h3><p>On-Chain Analytics</p></div></div><div class="wallet"><div class="pill"><i class="dot"></i><span id="wallet" class="blur">${w.slice(0,6)}...${w.slice(-4)}</span></div><button type="button" class="toggle" id="toggle">Show Address</button></div></div><div class="main"><div class="activity-box"><div class="label">Activity Level</div><div class="score">${tier}</div><div class="badge">${totalTx}+ Transaction</div></div><div class="circle"><svg class="score-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-bg" cx="50" cy="50" r="44"></circle><circle class="ring-fill" cx="50" cy="50" r="44"></circle></svg><div class="inner"><div class="big">$${totalVolume}</div><div class="small">Total Volume</div></div></div></div><div class="cardstats"><div class="cstat"><strong>${todayStreak}</strong><span>Today<br>Streak</span></div><div class="cstat"><strong>${activeMonths}</strong><span>Active<br>Months</span></div><div class="cstat"><strong>${totalTx}</strong><span>Total<br>Transaction</span></div><div class="cstat"><strong>${activeDays}</strong><span>Active<br>Days</span></div><div class="cstat"><strong>${longestStreak}</strong><span>Longest<br>Streak</span></div></div><div class="foot">Made For Robinhood Community</div></div><div class="actions" style="margin-top:10px!important;margin-bottom:10px!important;padding-top:0!important;"><button type="button" class="action download-premium" id="download">Download Card</button><button type="button" class="action share-button" id="share">Share On 𝕏</button></div></div>
<h2 class="title">Your Wallet Activity</h2><div class="stats"><div class="stat first-transaction"><small>First Transaction</small><strong>${firstTransaction}</strong></div><div class="stat"><small>Total Transaction</small><strong>${totalTx}</strong></div><div class="stat"><small>Last Transaction</small><strong>${lastTransaction}</strong></div><div class="stat today-streak-stat"><small>Today Streak</small><strong>${todayStreak} Days</strong></div><div class="stat"><small>Active Days</small><strong>${activeDays} Days</strong></div><div class="stat"><small>Longest Streak</small><strong>${longestStreak} Days</strong></div><div class="stat"><small>Active Months</small><strong>${activeMonths} Months</strong></div><div class="stat"><small>Total Volume</small><strong>$${totalVolume}</strong></div><div class="stat"><small>Wallet Age</small><strong>${walletAge} Months</strong></div><div class="stat"><small>Smart Contract</small><strong>${contractInteractions}</strong></div><div class="stat"><small>NFT</small><strong>${nftInteractions}</strong></div><div class="stat"><small>Deploy Contract</small><strong>${deployContracts}</strong></div></div>`;
  const fitVolume=el=>{if(!el)return;el.style.fontSize="46px";el.style.whiteSpace="nowrap";el.style.maxWidth="100%";el.style.overflow="visible";let size=46;const box=el.parentElement;while(el.scrollWidth>box.clientWidth-12&&size>14){size-=1;el.style.fontSize=size+"px";}if(el.scrollWidth>box.clientWidth-12){el.style.transform="scaleX(.85)";el.style.transformOrigin="center";}};
  fitVolume(result.querySelector(".inner .big"));
  document.getElementById("toggle").onclick=()=>{const a=document.getElementById("wallet");a.classList.toggle("blur");document.getElementById("toggle").textContent=a.classList.contains("blur")?"Show Address":"Hide Address"};
  document.getElementById("download").onclick=async()=>{const original=document.getElementById("card");const clone=original.cloneNode(true);const address=clone.querySelector("#wallet");if(address){address.textContent="0x0000••••0001";address.classList.remove("blur");}clone.style.position="fixed";clone.style.left="-100000px";clone.style.top="0";clone.style.width=original.offsetWidth+"px";document.body.appendChild(clone);fitVolume(clone.querySelector(".inner .big"));const c=await html2canvas(clone,{scale:4,useCORS:true,backgroundColor:null});clone.remove();const a=document.createElement("a");a.download="robinhood-chain-activity.png";a.href=c.toDataURL();a.click()};
  document.getElementById("share").onclick=()=>{const shareUrl="https://x.com/intent/post?text="+encodeURIComponent("Just checked my Robinhood Chain Activity ⚡\n\nActivity Level: "+tier+"\nTotal Transactions: "+totalTx);const opened=window.open(shareUrl,"_blank","noopener,noreferrer");if(!opened){window.location.assign(shareUrl);}};
  result.scrollIntoView({behavior:"smooth"});
}catch(error){
  tierDetails.style.display="block";
  result.innerHTML='<p style="text-align:center;color:#d9534f;padding:30px 0">'+(error.message||"Failed to fetch wallet activity")+'</p>';
}
});
