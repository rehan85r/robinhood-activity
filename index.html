<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Robinhood Chain Activity</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="brand">
            <img src="robinhood-logo.png" alt="Robinhood Logo">
            <span>Robinhood Activity</span>
        </div>

        <div class="network">
            Robinhood Chain
        </div>
    </header>


    <main class="container">

        <section class="hero">
            <p class="eyebrow">ON-CHAIN EXPLORER</p>

            <h1>
                Check Your Robinhood
                <br>
                <span>On-Chain Activity.</span>
            </h1>

            <p class="subtitle">
                Explore wallet activity, transaction history, streaks, and on-chain milestones.
            </p>

            <form id="walletForm">
                <input
                    type="text"
                    id="walletAddress"
                    placeholder="Paste wallet address (0x...)"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Check Activity
                    <span>→</span>
                </button>
            </form>

            <p class="helper">
                Enter a valid EVM wallet address to view activity.
            </p>
        </section>


        <section id="activityResult" class="activity-result"></section>

    </main>


    <script src="script.js"></script>

</body>
</html>
